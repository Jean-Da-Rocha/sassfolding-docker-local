services:
  traefik:
    container_name: ${SHARED_PROJECT_NAME}-traefik
    healthcheck:
      retries: 3
      start_period: 20s
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      timeout: 5s
    image: traefik:${TRAEFIK_VERSION}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-${SHARED_PROJECT_NAME}.entrypoints=https"
      - "traefik.http.routers.traefik-${SHARED_PROJECT_NAME}.rule=Host(`traefik.${SHARED_PROJECT_NAME}.${DNS_DOMAIN}`)"
      - "traefik.http.routers.traefik-${SHARED_PROJECT_NAME}.service=api@internal"
      - "traefik.http.routers.traefik-${SHARED_PROJECT_NAME}.tls=true"
    networks:
      - shared
    ports:
      - "${HTTP_FORWARD_PORT}:80"
      - "${HTTPS_FORWARD_PORT}:443"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_DIRECTORY}/traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DOCKER_DIRECTORY}/traefik/config/dynamic:/etc/traefik/dynamic:ro
      - ${DOCKER_DIRECTORY}/traefik/certs:/etc/traefik/certs:ro
