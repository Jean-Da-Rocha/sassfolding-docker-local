# The dashboard is served through a regular router (see the compose labels) instead of
# the insecure API listener, so nothing but the two entry points below is reachable.
api:
  dashboard: true

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          scheme: https
          to: https
  https:
    address: ":443"
  # Internal only, never published on the host. Used by the container healthcheck.
  ping:
    address: ":8082"

global:
  sendAnonymousUsage: false

log:
  format: common
  level: info

ping:
  entryPoint: ping

providers:
  docker:
    exposedByDefault: false
  # A single Traefik serves every project, so the certificate list is regenerated
  # into this directory by 'make update-certificates'.
  file:
    directory: /etc/traefik/dynamic
    watch: true
