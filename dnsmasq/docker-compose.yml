services:
  dnsmasq:
    cap_add:
      - NET_ADMIN
    container_name: ${SHARED_PROJECT_NAME}-dnsmasq
    entrypoint: ["dnsmasq"]
    command:
      - --no-daemon
      - --no-resolv
      - --no-hosts
      - --address=/${DNS_DOMAIN}/127.0.0.1
      - --server=1.1.1.1
      - --server=8.8.8.8
      - --log-facility=-
    healthcheck:
      retries: 3
      start_period: 5s
      test: ["CMD", "nslookup", "healthcheck.${DNS_DOMAIN}", "127.0.0.1"]
      timeout: 3s
    image: dockurr/dnsmasq:${DNSMASQ_VERSION}
    networks:
      - shared
    # Bound to the loopback interface on purpose: published on 0.0.0.0 this would be an
    # open resolver forwarding to 1.1.1.1 for the whole local network.
    ports:
      - "${DNSMASQ_IP_ADDRESS}:${DNSMASQ_FORWARD_PORT}:53/udp"
      - "${DNSMASQ_IP_ADDRESS}:${DNSMASQ_FORWARD_PORT}:53/tcp"
    restart: unless-stopped
